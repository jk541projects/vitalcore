.vc-coach-tip-title{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:.5px;}
.vc-coach-tip.warn .vc-coach-tip-title{color:#ef4444;}
.vc-coach-tip.caution .vc-coach-tip-title{color:#f59e0b;}
.vc-coach-tip.good .vc-coach-tip-title{color:#00e5a0;}
.vc-coach-tip.info .vc-coach-tip-title{color:#4fc3f7;}
.vc-coach-tip-body{font-size:13px;color:#8a9ab0;line-height:1.6;}
.vc-coach-summary{background:#161b22;border:1px solid #1e2530;border-radius:14px;padding:16px;margin-bottom:16px;}
.vc-coach-summary-title{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#5a6478;margin-bottom:10px;}
.vc-coach-summary-text{font-size:14px;color:#e8edf2;line-height:1.7;}
.vc-coach-loading{text-align:center;padding:30px;color:#5a6478;}
.vc-coach-loading-pulse{width:50px;height:50px;border-radius:50%;border:3px solid #00e5a0;animation:vcp 1.2s ease-in-out infinite;margin:0 auto 14px;}
.vc-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#161b22;border:1px solid #00e5a0;border-radius:10px;padding:12px 20px;font-size:13px;font-weight:500;color:#00e5a0;transition:transform .3s ease;z-index:500;white-space:nowrap;pointer-events:none;}
.vc-toast.show{transform:translateX(-50%) translateY(0);}
`;

function VitalCore() {
  const today = new Date().toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});

  const [logItems, setLogItems] = useState(() => {
    try { const s=JSON.parse(localStorage.getItem("vc_log")||"{}"); if(s.date===today) return s.items||[]; } catch(e){}
    return [];
  });
  const [totals, setTotals] = useState(() => {
    try { const s=JSON.parse(localStorage.getItem("vc_log")||"{}"); if(s.date===today&&s.totals) return s.totals; } catch(e){}
    return EMPTY();
  });
  const [history, setHistory] = useState(() => {
    try { return JSON.parse(localStorage.getItem("vc_history")||"[]"); } catch(e){ return []; }
  });
  const [library, setLibrary] = useState(() => {
    try { return JSON.parse(localStorage.getItem("vc_library")||"[]"); } catch(e){ return []; }
  });

  const [tab, setTab]             = useState("camera");
  const [input, setInput]         = useState("");
  const [servings, setServings]   = useState(1);
  const [analyzing, setAnalyzing] = useState(false);
  const [preview, setPreview]     = useState(null);
  const [needsLabel, setNeedsLabel] = useState(false);
  const [libSearch, setLibSearch] = useState("");
  const [histDetail, setHistDetail] = useState(null);
  const [toast, setToast]         = useState({msg:"",show:false});
  const [coachTips, setCoachTips] = useState(null);
  const [coachLoading, setCoachLoading] = useState(false);

  const toastTimer  = useRef(null);
  const textareaRef = useRef(null);
  const cameraRef   = useRef(null);
  const galleryRef  = useRef(null);

  const calPct = Math.min(Math.round(((totals.calories||0)/TARGETS.calories.goal)*100),999);
  const offset = 289-(289*Math.min(calPct,100)/100);

  const showToast = useCallback((msg) => {
    clearTimeout(toastTimer.current);
    setToast({msg,show:true});
    toastTimer.current = setTimeout(()=>setToast(t=>({...t,show:false})),2800);
  },[]);

  function recompute(items) {
    const n=EMPTY();
    for(const item of items) for(const k of NUTR_KEYS) n[k]+=(item.baseNutr[k]||0)*item.servings;
    return n;
  }

  function persist(items, t) {
    try { localStorage.setItem("vc_log",JSON.stringify({date:today,items,totals:t})); } catch(e){}
    if(items.length>0) {
      const snap={date:today,totals:{...t},itemCount:items.length};
      setHistory(prev=>{
        const next=[snap,...prev.filter(d=>d.date!==today)].slice(0,90);
        try { localStorage.setItem("vc_history",JSON.stringify(next)); } catch(e){}
        return next;
      });
    }
  }

  function handleFileSelect(e) {
    const file=e.target.files[0]; if(!file) return; e.target.value="";
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      const canvas=document.createElement("canvas");
      const MAX=1200; let w=img.width,h=img.height;
      if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
      canvas.width=w;canvas.height=h;
      canvas.getContext("2d").drawImage(img,0,0,w,h);
      const dataUrl=canvas.toDataURL("image/jpeg",.85);
      setPreview({dataUrl,base64:dataUrl.split(",")[1],mime:"image/jpeg"});
    };
    img.src=url;
  }

  async function analyzeImage() {
    if(!preview) return;
    setAnalyzing(true);
    const prompt=`You are a nutrition analysis AI. Analyze this food/drink/supplement image. If you can read a nutrition label use exact values. If you recognize the product estimate from standard data. Return ONLY valid JSON no markdown no backticks: {"name":"short name","emoji":"single emoji","needs_label":false,"calories":number,"protein":number,"carbs":number,"fat":number,"fiber":number,"sodium":number,"calcium":number,"magnesium":number,"vitD":number,"vitC":number,"potassium":number,"zinc":number,"sugar":number} Values per 1 serving. Return 0 for negligible never null.`;
    try {
      const res=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-5",max_tokens:600,messages:[{role:"user",content:[
          {type:"image",source:{type:"base64",media_type:preview.mime,data:preview.base64}},
          {type:"text",text:prompt}
        ]}]})});
      const data=await res.json();
      if(data.error){showToast("Error: "+String(data.error).slice(0,60));return;}
      const raw=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text||"").join("").replace(/```json|```/g,"").trim();
      if(!raw){showToast("No response — try typing instead");return;}
      const n=JSON.parse(raw);
      if(n.needs_label){setNeedsLabel(true);setPreview(null);return;}
      addItem(n,null,servings);
      setPreview(null);setNeedsLabel(false);setServings(1);
    } catch(e){showToast("Error: "+String(e.message||e).slice(0,60));}
    finally{setAnalyzing(false);}
  }

  async function handleLog() {
    const text=input.trim(); if(!text||analyzing) return;
    setAnalyzing(true);setInput("");const srv=servings;setServings(1);
    const prompt=`You are a nutrition analysis AI. The user consumed: "${text}" Return ONLY valid JSON no markdown no backticks: {"name":"clean short name","emoji":"single emoji","calories":number,"protein":number,"carbs":number,"fat":number,"fiber":number,"sodium":number,"calcium":number,"magnesium":number,"vitD":number,"vitC":number,"potassium":number,"zinc":number,"sugar":number} Values per 1 serving. Return 0 for negligible never null.`;
    try {
      const res=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-5",max_tokens:500,messages:[{role:"user",content:prompt}]})});
      const data=await res.json();
      if(data.error){showToast("Error: "+String(data.error).slice(0,60));return;}
      const raw=(data.content||[]).map(b=>b.text||"").join("").replace(/```json|```/g,"").trim();
      const n=JSON.parse(raw);
      addItem(n,text,srv);
    } catch(e){showToast("Error: "+String(e.message||e).slice(0,60));}
    finally{setAnalyzing(false);}
  }

  function addItem(n, originalText, srv) {
    const time=new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",hour12:true});
    const baseNutr={
      calories:+n.calories||0,protein:+n.protein||0,carbs:+n.carbs||0,fat:+n.fat||0,
      fiber:+n.fiber||0,sodium:+n.sodium||0,calcium:+n.calcium||0,magnesium:+n.magnesium||0,
      vitD:+n.vitD||0,vitC:+n.vitC||0,potassium:+n.potassium||0,zinc:+n.zinc||0,sugar:+n.sugar||0,
    };
    const item={id:Date.now(),time,name:n.name||(originalText||"Item"),emoji:n.emoji||"🍽️",servings:srv,baseNutr};
    setLogItems(prev=>{const next=[item,...prev];const t=recompute(next);setTotals(t);persist(next,t);return next;});
    setLibrary(prev=>{
      if(prev.find(l=>l.name.toLowerCase()===item.name.toLowerCase())) return prev;
      const next=[{id:item.id,name:item.name,emoji:item.emoji,baseNutr},...prev].slice(0,100);
      try{localStorage.setItem("vc_library",JSON.stringify(next));}catch(e){}
      return next;
    });
    showToast("✓ "+item.name+" × "+srv+" logged");
  }

  function logFromLib(libItem) {
    const time=new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",hour12:true});
    const item={id:Date.now(),time,name:libItem.name,emoji:libItem.emoji,servings:1,baseNutr:libItem.baseNutr};
    setLogItems(prev=>{const next=[item,...prev];const t=recompute(next);setTotals(t);persist(next,t);return next;});
    showToast("✓ "+item.name+" logged");
  }

  function changeServings(id,delta) {
    setLogItems(prev=>{
      const next=prev.map(i=>i.id!==id?i:{...i,servings:Math.max(0.5,Math.min(10,+(i.servings+delta).toFixed(1)))});
      const t=recompute(next);setTotals(t);persist(next,t);return next;
    });
  }

  function deleteItem(id) {
    setLogItems(prev=>{const next=prev.filter(i=>i.id!==id);const t=recompute(next);setTotals(t);persist(next,t);return next;});
    showToast("Item removed");
  }

  function resetDay() {
    if(!window.confirm("Reset today's log?")) return;
    setLogItems([]);setTotals(EMPTY());setCoachTips(null);
    try{localStorage.setItem("vc_log",JSON.stringify({date:today,items:[],totals:EMPTY()}));}catch(e){}
    showToast("Day reset");
  }

  function delFromLib(id) {
    setLibrary(prev=>{const next=prev.filter(i=>i.id!==id);try{localStorage.setItem("vc_library",JSON.stringify(next));}catch(e){}return next;});
  }

  function statusFor(key,val) {
    const {goal,unit}=TARGETS[key],pct=(val/goal)*100;
    if(val===0)  return{text:"Need "+goal+unit,color:"#5a6478"};
    if(pct>110)  return{text:"Over by "+Math.round(val-goal)+unit,color:"#ef4444"};
    if(pct>=100) return{text:"✓ Goal met",color:"#00e5a0"};
    if(pct<30)   return{text:Math.round(goal-val)+unit+" remaining",color:"#f59e0b"};
    return       {text:Math.round(goal-val)+unit+" remaining",color:"#00e5a0"};
  }

  const scaled=(item,key)=>fmt(item.baseNutr[key]*item.servings);

  // ── AI COACH ──────────────────────────────────────────────────
  async function getCoachAdvice() {
    if(logItems.length===0){showToast("Log some food first!");return;}
    setCoachLoading(true);setCoachTips(null);

    const nutrientSummary = Object.entries(TARGETS).map(([key,cfg])=>{
      const val=totals[key]||0;
      const pct=Math.round((val/cfg.goal)*100);
      const ctx=NUTRIENT_CONTEXT[key];
      return key+": "+Math.round(val)+cfg.unit+" ("+pct+"% of "+cfg.goal+cfg.unit+" goal) — canExceed:"+ctx.canExceed;
    }).join("\n");

    const foodList=logItems.map(i=>i.name+" x"+i.servings).join(", ");
    const hour=new Date().getHours();
    const timeOfDay=hour<12?"morning":hour<17?"afternoon":"evening";

    const prompt=`You are a friendly, plain-English nutrition coach for a health app called VitalCore. The user is a 45-year-old active male working toward building strength, losing fat, and protecting bad knees.

It is currently ${timeOfDay}. Today they have logged: ${foodList}

Here is their current nutrient status:
${nutrientSummary}

Provide 4-6 short, practical coaching tips based on what you see. Be conversational and encouraging — not clinical. 

IMPORTANT RULES:
- For nutrients marked canExceed:true (protein, fiber, vitC, potassium, magnesium), exceeding the goal is FINE — say so if they're over
- For nutrients marked canExceed:false (calories, sodium, sugar, fat, zinc, vitD, calcium, carbs), flag it if they're approaching or over 85%
- If it's morning/afternoon and they're already high on sodium or sugar, warn them proactively
- If protein is low and it's still early, encourage them to hit it
- Keep each tip to 2-3 sentences max
- Use everyday language — no medical jargon

Return ONLY a JSON array, no markdown, no backticks:
[
  {"type":"good|caution|warn|info","icon":"emoji","title":"short title","body":"2-3 sentence tip"},
  ...
]

Types: "good"=positive/on track, "caution"=worth watching, "warn"=needs attention, "info"=general insight`;

    try {
      const res=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-5",max_tokens:1000,messages:[{role:"user",content:prompt}]})});
      const data=await res.json();
      if(data.error){showToast("Coach error: "+String(data.error).slice(0,50));return;}
      const raw=(data.content||[]).map(b=>b.text||"").join("").replace(/```json|```/g,"").trim();
      const tips=JSON.parse(raw);
      setCoachTips(tips);
    } catch(e){showToast("Coach error — try again");}
    finally{setCoachLoading(false);}
  }

  // HISTORY helpers
  function dayClass(snap) {
    if(!snap) return "nodata";
    const pct=(snap.totals.calories||0)/TARGETS.calories.goal*100;
    if(pct>=90&&pct<=115) return "great";
    if(pct>=70&&pct<90)   return "good";
    if(pct>115)           return "over";
    return "low";
  }

  function HistoryTab() {
    const last30=history.slice(0,30);
    const chartDays=[...last30].reverse();
    const maxCal=Math.max(...chartDays.map(d=>d.totals.calories||0),TARGETS.calories.goal,1);
    const maxPro=Math.max(...chartDays.map(d=>d.totals.protein||0),TARGETS.protein.goal,1);
    const calDays=[];
    for(let i=34;i>=0;i--){
      const d=new Date();d.setDate(d.getDate()-i);
      const label=d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
      calDays.push({label,dayNum:d.getDate(),dayOfWeek:d.getDay(),snap:history.find(h=>h.date===label)||null});
    }
    const padStart=calDays[0].dayOfWeek;
    return (
      <div className="vc-hist">
        {history.length===0?(
          <div className="vc-hist-empty">
            <div style={{fontSize:36,marginBottom:12}}>📈</div>
            <p style={{fontSize:14,lineHeight:1.7}}>Your history builds automatically.<br/>Log food each day and come back<br/>to see your trends over time.</p>
          </div>
        ):(
          <React.Fragment>
            <div className="vc-hist-section">
              <div className="vc-hist-title">Calorie Heatmap — Tap a Day</div>
              <div className="vc-cal">
                {["Su","Mo","Tu","We","Th","Fr","Sa"].map(d=><div className="vc-cal-lbl" key={d}>{d}</div>)}
                {Array(padStart).fill(null).map((_,i)=><div className="vc-cal-day empty" key={"p"+i}/>)}
                {calDays.map(day=>(
                  <div key={day.label}
                    className={"vc-cal-day "+dayClass(day.snap)+(histDetail===day.label?" selected":"")}
                    style={{cursor:day.snap?"pointer":"default"}}
                    onClick={()=>day.snap&&setHistDetail(histDetail===day.label?null:day.label)}>
                    {day.dayNum}
                  </div>
                ))}
              </div>
              <div className="vc-cal-legend">
                {[["rgba(0,229,160,.25)","On target"],["rgba(0,229,160,.12)","Slightly low"],["rgba(245,158,11,.15)","Under 70%"],["rgba(239,68,68,.15)","Over 115%"]].map(([c,l])=>(
                  <div className="vc-cal-legend-item" key={l}><div className="vc-cal-dot" style={{background:c}}/>{l}</div>
                ))}
              </div>
            </div>
            {histDetail&&(()=>{
              const snap=history.find(h=>h.date===histDetail);
              if(!snap) return null;
              return(
                <div className="vc-day-card">
                  <div className="vc-day-hdr">
                    <div className="vc-day-date">{snap.date} · {snap.itemCount} items</div>
                    <div className="vc-day-cal">{Math.round(snap.totals.calories||0)} kcal</div>
                  </div>
                  <div className="vc-day-nuts">
                    {Object.entries(TARGETS).map(([key,cfg])=>{
                      const val=snap.totals[key]||0,pct=(val/cfg.goal)*100;
                      const cls=pct>=90&&pct<=115?"vc-dnut-hit":pct>115?"vc-dnut-over":"vc-dnut-miss";
                      return <div className={"vc-dnut "+cls} key={key}>{cfg.label}: {Math.round(val)}{cfg.unit}</div>;
                    })}
                  </div>
                </div>
              );
            })()}
            {chartDays.length>1&&(
              <div className="vc-hist-section">
                <div className="vc-hist-title">Calorie Trend</div>
                <div className="vc-chart">
                  <div className="vc-chart-hdr"><div className="vc-chart-title">Daily Calories</div><div className="vc-chart-goal">Goal: {TARGETS.calories.goal} kcal</div></div>
                  <div className="vc-chart-bars">
                    {chartDays.map((d,i)=>{
                      const val=d.totals.calories||0,pct=Math.min((val/maxCal)*100,100);
                      const color=val>TARGETS.calories.goal*1.15?"#ef4444":val<TARGETS.calories.goal*.7?"#f59e0b":"#00e5a0";
                      return(<div className="vc-chart-bar-wrap" key={i}><div className="vc-chart-bar" style={{height:pct+"%",background:color}}/><div className="vc-chart-lbl">{(d.date.split(",")[1]||"").trim().split(" ")[1]||""}</div></div>);
                    })}
                  </div>
                  <div className="vc-chart-legend"><span style={{color:"#00e5a0"}}>■ Target</span><span style={{color:"#f59e0b"}}>■ Low</span><span style={{color:"#ef4444"}}>■ Over</span></div>
                </div>
              </div>
            )}
            {chartDays.length>1&&(
              <div className="vc-hist-section">
                <div className="vc-hist-title">Protein Trend</div>
                <div className="vc-chart">
                  <div className="vc-chart-hdr"><div className="vc-chart-title">Daily Protein</div><div className="vc-chart-goal">Goal: {TARGETS.protein.goal}g</div></div>
                  <div className="vc-chart-bars">
                    {chartDays.map((d,i)=>{
                      const val=d.totals.protein||0,pct=Math.min((val/maxPro)*100,100);
                      return(<div className="vc-chart-bar-wrap" key={i}><div className="vc-chart-bar" style={{height:pct+"%",background:val>=TARGETS.protein.goal*.9?"#00e5a0":"#f59e0b"}}/><div className="vc-chart-lbl">{(d.date.split(",")[1]||"").trim().split(" ")[1]||""}</div></div>);
                    })}
                  </div>
                </div>
              </div>
            )}
            <div className="vc-hist-section">
              <div className="vc-hist-title">30-Day Nutrient Averages</div>
              {Object.entries(TARGETS).map(([key,cfg])=>{
                const avg=last30.reduce((s,d)=>s+(d.totals[key]||0),0)/Math.max(last30.length,1);
                const pct=Math.min((avg/cfg.goal)*100,120),over=pct>110;
                const color=over?"#ef4444":pct>=80?"#00e5a0":pct>=50?"#f59e0b":"#3a4456";
                const msg=over?"Averaging over by "+Math.round(avg-cfg.goal)+cfg.unit:pct>=80?"✓ Consistently meeting goal":pct>=50?Math.round(cfg.goal-avg)+cfg.unit+" short on average":"Significantly under — avg "+Math.round(pct)+"% of goal";
                return(
                  <div className="vc-avg-item" key={key}>
                    <div className="vc-nhdr"><span className="vc-nname">{cfg.label}</span><span className="vc-nvals"><strong>{Math.round(avg)}{cfg.unit}</strong> avg / {cfg.goal}{cfg.unit}</span></div>
                    <div className="vc-track"><div className="vc-fill" style={{width:Math.min(pct,100)+"%",background:color}}/></div>
                    <div className="vc-nst" style={{color}}>{msg}</div>
                  </div>
                );
              })}
            </div>
          </React.Fragment>
        )}
      </div>
    );
  }

  function CoachTab() {
    return (
      <div className="vc-coach">
        <button className="vc-coach-btn" onClick={getCoachAdvice} disabled={coachLoading||logItems.length===0}>
          {coachLoading?"Analyzing your day…":"🤖 Get Coaching Advice"}
        </button>

        {logItems.length===0&&(
          <div className="vc-coach-empty">
            <div className="vc-coach-empty-icon">🥗</div>
            <p style={{fontSize:14,color:"#5a6478",lineHeight:1.6}}>Log some food first, then come back here for personalized advice based on your actual day.</p>
          </div>
        )}

        {coachLoading&&(
          <div className="vc-coach-loading">
            <div className="vc-coach-loading-pulse"/>
            <p>Reviewing your nutrition…</p>
          </div>
        )}

        {coachTips&&!coachLoading&&(
          <React.Fragment>
            <div className="vc-coach-summary">
              <div className="vc-coach-summary-title">Today at a Glance</div>
              <div className="vc-coach-summary-text">
                {Math.round(totals.calories||0)} kcal · {Math.round(totals.protein||0)}g protein · {logItems.length} items logged
              </div>
            </div>
            {coachTips.map((tip,i)=>(
              <div className={"vc-coach-tip "+tip.type} key={i}>
                <div className="vc-coach-tip-hdr">
                  <div className="vc-coach-tip-icon">{tip.icon}</div>
                  <div className="vc-coach-tip-title">{tip.title}</div>
                </div>
                <div className="vc-coach-tip-body">{tip.body}</div>
              </div>
            ))}
          </React.Fragment>
        )}
      </div>
    );
  }

  return (
    <React.Fragment>
      <style>{S}</style>
      <div className="vc">

        <header className="vc-hdr">
          <div className="vc-logo">Vital<span>Core</span></div>
          <div className="vc-date">{today}</div>
        </header>

        <div className="vc-sum">
          <div className="vc-sum-card">
            <div className="vc-ring">
              <svg width="110" height="110" viewBox="0 0 110 110">
                <circle cx="55" cy="55" r="46" fill="none" stroke="#1e2530" strokeWidth="8"/>
                <circle cx="55" cy="55" r="46" fill="none" stroke="#00e5a0" strokeWidth="8"
                  strokeLinecap="round" strokeDasharray="289" strokeDashoffset={offset}
                  style={{transition:"stroke-dashoffset 1s ease"}}/>
              </svg>
              <div className="vc-ring-ctr">
                <div className="vc-ring-pct">{calPct}%</div>
                <div className="vc-ring-lbl">calories</div>
              </div>
            </div>
            <div>
              <div className="vc-sum-title">Today's Intake</div>
              <div className="vc-chips">
                {[{k:"protein",l:"Protein",c:"#00e5a0",u:"g"},{k:"carbs",l:"Carbs",c:"#4fc3f7",u:"g"},
                  {k:"fat",l:"Fat",c:"#ff6b35",u:"g"},{k:"calories",l:"kcal",c:"#f59e0b",u:""}].map(m=>(
                  <div className="vc-chip" key={m.k}>
                    <span className="vc-chip-v" style={{color:m.c}}>{Math.round(totals[m.k]||0)}{m.u}</span>
                    <span className="vc-chip-l">{m.l}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>

        <div className="vc-tabs">
          <button className={"vc-tab"+(tab==="camera"?" active":"")} onClick={()=>setTab("camera")}>📷 Camera</button>
          <button className={"vc-tab"+(tab==="text"?" active":"")} onClick={()=>setTab("text")}>✏️ Type</button>
          <button className={"vc-tab"+(tab==="library"?" active":"")} onClick={()=>setTab("library")}>📚 Library</button>
          <button className={"vc-tab"+(tab==="history"?" active":"")} onClick={()=>setTab("history")}>📈 History</button>
          <button className={"vc-tab"+(tab==="coach"?" active":"")} onClick={()=>setTab("coach")}>🤖 Coach</button>
        </div>

        {tab==="camera"&&(
          <div className="vc-cam-wrap">
            <div className="vc-cam-card">
              <span className="vc-cam-label">Snap or Upload a Photo</span>
              {needsLabel&&(
                <div className="vc-label-prompt">
                  <div className="vc-lp-icon">🏷️</div>
                  <div className="vc-lp-title">Label Needed</div>
                  <div className="vc-lp-sub">Snap the nutrition facts label on the back.</div>
                  <button className="vc-lp-btn" onClick={()=>{setNeedsLabel(false);cameraRef.current.click();}}>📷 Snap Label</button>
                </div>
              )}
              {!needsLabel&&!preview&&(
                <div className="vc-cam-btns">
                  <button className="vc-cam-btn" onClick={()=>cameraRef.current.click()}>
                    <div className="vc-cam-icon">📷</div>
                    <div className="vc-cam-txt"><span className="vc-cam-ttl">Take a Photo</span><span className="vc-cam-sub">Open camera</span></div>
                  </button>
                  <button className="vc-cam-btn" onClick={()=>galleryRef.current.click()}>
                    <div className="vc-cam-icon">🖼️</div>
                    <div className="vc-cam-txt"><span className="vc-cam-ttl">Choose from Gallery</span><span className="vc-cam-sub">Pick existing photo</span></div>
                  </button>
                </div>
              )}
              {preview&&(
                <React.Fragment>
                  <img src={preview.dataUrl} className="vc-preview" alt="preview"/>
                  <div className="vc-srv-row" style={{marginBottom:14}}>
                    <span className="vc-srv-label">Servings</span>
                    <div className="vc-srv-ctrl">
                      <button className="vc-srv-btn" onClick={()=>setServings(s=>Math.max(0.5,+(s-.5).toFixed(1)))} disabled={servings<=0.5}>−</button>
                      <div className="vc-srv-val">{servings}</div>
                      <button className="vc-srv-btn" onClick={()=>setServings(s=>Math.min(10,+(s+.5).toFixed(1)))} disabled={servings>=10}>+</button>
                    </div>
                  </div>
                  <button className="vc-analyze-btn" onClick={analyzeImage} disabled={analyzing}>Analyze &amp; Log</button>
                  <div className="vc-divider">or</div>
                  <button className="vc-cam-btn" onClick={()=>setPreview(null)} style={{justifyContent:"center",color:"#5a6478"}}>← Different photo</button>
                </React.Fragment>
              )}
              <input ref={cameraRef} type="file" accept="image/*" capture="environment" onChange={handleFileSelect} style={{display:"none"}}/>
              <input ref={galleryRef} type="file" accept="image/*" onChange={handleFileSelect} style={{display:"none"}}/>
            </div>
          </div>
        )}

        {tab==="text"&&(
          <div className="vc-input-wrap">
            <div className="vc-input-card">
              <span className="vc-input-label">Describe What You Ate</span>
              <div className="vc-input-row">
                <textarea ref={textareaRef} className="vc-textarea"
                  placeholder='"Premier Protein shake" or "6oz chicken breast"'
                  value={input} onChange={e=>setInput(e.target.value)}
                  onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();handleLog();}}}
                  rows={2}/>
                <button className="vc-log-btn" onClick={handleLog} disabled={!input.trim()||analyzing}>Log It</button>
              </div>
              <div className="vc-srv-row">
                <span className="vc-srv-label">Servings</span>
                <div className="vc-srv-ctrl">
                  <button className="vc-srv-btn" onClick={()=>setServings(s=>Math.max(0.5,+(s-.5).toFixed(1)))} disabled={servings<=0.5}>−</button>
                  <div className="vc-srv-val">{servings}</div>
                  <button className="vc-srv-btn" onClick={()=>setServings(s=>Math.min(10,+(s+.5).toFixed(1)))} disabled={servings>=10}>+</button>
                </div>
              </div>
              <div className="vc-examples">
                {EXAMPLES.map(ex=><button key={ex} className="vc-ex" onClick={()=>{setInput(ex);textareaRef.current&&textareaRef.current.focus();}}>{ex}</button>)}
              </div>
            </div>
          </div>
        )}

        {tab==="library"&&(
          <div className="vc-lib">
            <input className="vc-lib-search" placeholder="Search your food library…"
              value={libSearch} onChange={e=>setLibSearch(e.target.value)}/>
            {library.length===0?(
              <div className="vc-hist-empty"><div style={{fontSize:36,marginBottom:12}}>📚</div><p style={{fontSize:14,lineHeight:1.6}}>Foods you log are saved here<br/>for quick re-logging.</p></div>
            ):library.filter(i=>i.name.toLowerCase().includes(libSearch.toLowerCase())).map(item=>(
              <div className="vc-lib-item" key={item.id}>
                <div className="vc-lib-icon">{item.emoji}</div>
                <div className="vc-lib-det">
                  <div className="vc-lib-name">{item.name}</div>
                  <div className="vc-lib-macros">{item.baseNutr.calories} kcal · {item.baseNutr.protein}g protein · {item.baseNutr.carbs}g carbs</div>
                </div>
                <button className="vc-lib-add" onClick={()=>logFromLib(item)}>+ Log</button>
                <button className="vc-lib-del" onClick={()=>delFromLib(item.id)}>✕</button>
              </div>
            ))}
          </div>
        )}

        {tab==="history"&&<HistoryTab/>}
        {tab==="coach"&&<CoachTab/>}

        <div className="vc-nutrients">
          <div className="vc-sec">Daily Progress</div>
          <div className="vc-nlist">
            {Object.entries(TARGETS).map(([key,cfg])=>{
              const val=totals[key]||0,pct=Math.min((val/cfg.goal)*100,100),over=(val/cfg.goal)>1.1,st=statusFor(key,val);
              return(
                <div className="vc-nitem" key={key}>
                  <div className="vc-nhdr">
                    <span className="vc-nname">{cfg.label}</span>
                    <span className="vc-nvals"><strong>{Math.round(val)}{cfg.unit}</strong> / {cfg.goal}{cfg.unit}</span>
                  </div>
                  <div className="vc-track"><div className="vc-fill" style={{width:pct+"%",background:over?"#ef4444":cfg.color}}/></div>
                  <div className="vc-nst" style={{color:st.color}}>{st.text}</div>
                </div>
              );
            })}
          </div>
        </div>

        <div className="vc-log">
          <div className="vc-log-hdr">
            <div className="vc-sec" style={{marginBottom:0}}>Logged Items</div>
            {logItems.length>0&&<button className="vc-rst" onClick={resetDay}>Reset Day</button>}
          </div>
          <div className="vc-llist">
            {logItems.length===0?(
              <div className="vc-empty"><div className="vc-ei">🥗</div><p>Snap a photo or type what you ate<br/>to start tracking.</p></div>
            ):logItems.map(item=>(
              <div className="vc-litem" key={item.id}>
                <div className="vc-licon">{item.emoji}</div>
                <div className="vc-ldet">
                  <div className="vc-lname">{item.name}</div>
                  <div className="vc-ltime">{item.time}</div>
                  <div className="vc-ltags">
                    {item.baseNutr.protein>0&&<span className="vc-tag vc-tp">{scaled(item,"protein")}g protein</span>}
                    {item.baseNutr.carbs>0&&<span className="vc-tag vc-tc">{scaled(item,"carbs")}g carbs</span>}
                    {item.baseNutr.fat>0&&<span className="vc-tag vc-tf">{scaled(item,"fat")}g fat</span>}
                    {item.baseNutr.calories>0&&<span className="vc-tag vc-tk">{scaled(item,"calories")} kcal</span>}
                  </div>
                  <div className="vc-item-srv">
                    <span className="vc-item-srv-label">Servings</span>
                    <button className="vc-isb" onClick={()=>changeServings(item.id,-.5)} disabled={item.servings<=0.5}>−</button>
                    <span className="vc-isv">{item.servings}</span>
                    <button className="vc-isb" onClick={()=>changeServings(item.id,.5)} disabled={item.servings>=10}>+</button>
                  </div>
                </div>
                <div className="vc-lright">
                  <button className="vc-del" onClick={()=>deleteItem(item.id)}>✕</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {analyzing&&(
        <div className="vc-analyzing">
          <div className="vc-pulse"/>
          <div className="vc-at">Analyzing</div>
          <div className="vc-as">Looking up nutrition data…</div>
        </div>
      )}
      <div className={"vc-toast"+(toast.show?" show":"")}>{toast.msg}</div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<VitalCore/>);
</script>
</body>
</html>
