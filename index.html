<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0a0c0f"/>
<title>VitalCore</title>
<link rel="manifest" href="manifest.json"/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useCallback, useEffect } = React;

const WORKER_URL = "https://vitalcore-proxy.jason-knight-541.workers.dev";

// ── PROFILE TARGETS ────────────────────────────────────────────
const PROFILE_TARGETS = {
  adult_male:   { calories:2200, protein:160, carbs:200, fat:65,  fiber:30, sodium:2300, calcium:1000, magnesium:420, vitD:600, vitC:90,  potassium:3500, zinc:11, sugar:50 },
  adult_female: { calories:1800, protein:110, carbs:180, fat:55,  fiber:25, sodium:2300, calcium:1000, magnesium:320, vitD:600, vitC:75,  potassium:2600, zinc:8,  sugar:40 },
  child:        { calories:1800, protein:52,  carbs:240, fat:60,  fiber:26, sodium:1900, calcium:1300, magnesium:240, vitD:600, vitC:45,  potassium:2300, zinc:8,  sugar:25 },
  teen:         { calories:2200, protein:75,  carbs:250, fat:70,  fiber:28, sodium:2300, calcium:1300, magnesium:360, vitD:600, vitC:75,  potassium:3000, zinc:11, sugar:35 },
};

const NUTR_META = {
  calories:  { label:"Calories",  unit:"kcal", color:"#f59e0b", canExceed:false },
  protein:   { label:"Protein",   unit:"g",    color:"#00e5a0", canExceed:true  },
  carbs:     { label:"Carbs",     unit:"g",    color:"#4fc3f7", canExceed:false },
  fat:       { label:"Fat",       unit:"g",    color:"#ff6b35", canExceed:false },
  fiber:     { label:"Fiber",     unit:"g",    color:"#00e5a0", canExceed:true  },
  sodium:    { label:"Sodium",    unit:"mg",   color:"#ff6b35", canExceed:false },
  calcium:   { label:"Calcium",   unit:"mg",   color:"#4fc3f7", canExceed:false },
  magnesium: { label:"Magnesium", unit:"mg",   color:"#4fc3f7", canExceed:true  },
  vitD:      { label:"Vitamin D", unit:"IU",   color:"#f59e0b", canExceed:false },
  vitC:      { label:"Vitamin C", unit:"mg",   color:"#f59e0b", canExceed:true  },
  potassium: { label:"Potassium", unit:"mg",   color:"#00e5a0", canExceed:true  },
  zinc:      { label:"Zinc",      unit:"mg",   color:"#00e5a0", canExceed:false },
  sugar:     { label:"Sugar",     unit:"g",    color:"#ff6b35", canExceed:false },
};
const NUTR_KEYS = Object.keys(NUTR_META);
const EMPTY = () => Object.fromEntries(NUTR_KEYS.map(k=>[k,0]));
const fmt = v => Number.isInteger(v) ? v : +v.toFixed(1);

const PROFILE_TYPE_LABELS = {
  adult_male:"Adult Male", adult_female:"Adult Female", child:"Child (4–8)", teen:"Teen (9–18)"
};

const AVATAR_COLORS = ["#00e5a0","#4fc3f7","#ff6b35","#f59e0b","#a78bfa","#f472b6","#34d399"];

function getColor(idx){ return AVATAR_COLORS[idx % AVATAR_COLORS.length]; }

// ── STORAGE HELPERS (user-scoped) ──────────────────────────────
function uKey(uid, key){ return "vc_"+key+"_"+uid; }
function uGet(uid, key, fallback){ try{const v=localStorage.getItem(uKey(uid,key));return v?JSON.parse(v):fallback;}catch(e){return fallback;} }
function uSet(uid, key, val){ try{localStorage.setItem(uKey(uid,key),JSON.stringify(val));}catch(e){} }

// Global profiles list (not user-scoped)
function getProfiles(){ try{return JSON.parse(localStorage.getItem("vc_profiles")||"[]");}catch(e){return [];} }
function saveProfiles(p){ try{localStorage.setItem("vc_profiles",JSON.stringify(p));}catch(e){} }
function getActiveId(){ return localStorage.getItem("vc_active_profile")||null; }
function setActiveId(id){ localStorage.setItem("vc_active_profile",id); }

// ── EXAMPLES ──────────────────────────────────────────────────
const EXAMPLES = [
  "Premier Protein chocolate shake","2 scrambled eggs + toast",
  "6oz grilled chicken breast","Magnesium glycinate 2 caps",
  "Quarter-pound burger","Greek yogurt with berries",
];

// ── PROFILE SCREEN ─────────────────────────────────────────────
function ProfileScreen({ onSelect }) {
  const [profiles, setProfiles] = useState(getProfiles);
  const [showNew, setShowNew] = useState(false);
  const [newName, setNewName] = useState("");
  const [newType, setNewType] = useState("adult_male");

  function createProfile() {
    if(!newName.trim()) return;
    const p = { id: Date.now().toString(), name: newName.trim(), type: newType, createdAt: Date.now() };
    const next = [...profiles, p];
    saveProfiles(next);
    setProfiles(next);
    setNewName(""); setShowNew(false);
    onSelect(p);
  }

  function deleteProfile(id) {
    if(!window.confirm("Delete this profile and all its data?")) return;
    const next = profiles.filter(p=>p.id!==id);
    saveProfiles(next);
    setProfiles(next);
    // Clean up their data
    ["log","history","library","recipes"].forEach(k=>localStorage.removeItem(uKey(id,k)));
  }

  return (
    <div style={{background:"#0a0c0f",minHeight:"100vh",maxWidth:480,margin:"0 auto",padding:20,fontFamily:"'DM Sans',sans-serif",color:"#e8edf2"}}>
      <div style={{paddingTop:40,paddingBottom:30,textAlign:"center"}}>
        <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:900,fontSize:32,letterSpacing:3,textTransform:"uppercase",color:"#00e5a0",marginBottom:6}}>
          Vital<span style={{color:"#e8edf2"}}>Core</span>
        </div>
        <div style={{fontSize:13,color:"#5a6478"}}>Who's tracking today?</div>
      </div>

      {profiles.length===0 && !showNew && (
        <div style={{textAlign:"center",padding:"30px 0",color:"#5a6478",fontSize:14,lineHeight:1.7}}>
          No profiles yet.<br/>Create one to get started.
        </div>
      )}

      <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:16}}>
        {profiles.map((p,i)=>(
          <div key={p.id} style={{background:"#161b22",border:"1px solid #1e2530",borderRadius:16,padding:"16px 16px",display:"flex",alignItems:"center",gap:14}}>
            <div style={{width:48,height:48,borderRadius:"50%",background:getColor(i),display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Barlow Condensed',sans-serif",fontWeight:900,fontSize:20,color:"#000",flexShrink:0}}>
              {p.name[0].toUpperCase()}
            </div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:600,fontSize:16,marginBottom:2}}>{p.name}</div>
              <div style={{fontSize:11,color:"#5a6478"}}>{PROFILE_TYPE_LABELS[p.type]||p.type}</div>
            </div>
            <button onClick={()=>deleteProfile(p.id)} style={{background:"none",border:"none",color:"#3a4456",cursor:"pointer",fontSize:16,padding:4,transition:"color .2s"}}
              onMouseOver={e=>e.target.style.color="#ef4444"} onMouseOut={e=>e.target.style.color="#3a4456"}>✕</button>
            <button onClick={()=>{setActiveId(p.id);onSelect(p);}}
              style={{background:"#00e5a0",color:"#000",border:"none",borderRadius:10,padding:"10px 18px",fontFamily:"'Barlow Condensed',sans-serif",fontSize:15,fontWeight:700,letterSpacing:1,cursor:"pointer",flexShrink:0}}>
              Go →
            </button>
          </div>
        ))}
      </div>

      {!showNew ? (
        <button onClick={()=>setShowNew(true)}
          style={{width:"100%",background:"none",border:"2px dashed #1e2530",color:"#5a6478",borderRadius:14,padding:16,fontFamily:"'Barlow Condensed',sans-serif",fontSize:16,fontWeight:700,letterSpacing:1,textTransform:"uppercase",cursor:"pointer",transition:"all .2s"}}
          onMouseOver={e=>{e.target.style.borderColor="#00e5a0";e.target.style.color="#00e5a0";}}
          onMouseOut={e=>{e.target.style.borderColor="#1e2530";e.target.style.color="#5a6478";}}>
          + Add Profile
        </button>
      ):(
        <div style={{background:"#161b22",border:"1px solid #1e2530",borderRadius:16,padding:16}}>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:13,fontWeight:600,letterSpacing:2,textTransform:"uppercase",color:"#5a6478",marginBottom:12}}>New Profile</div>
          <input value={newName} onChange={e=>setNewName(e.target.value)}
            placeholder="Name (e.g. Jason, Kai)"
            onKeyDown={e=>e.key==="Enter"&&createProfile()}
            style={{width:"100%",background:"#111418",border:"1px solid #1e2530",borderRadius:10,padding:"11px 14px",color:"#e8edf2",fontFamily:"'DM Sans',sans-serif",fontSize:14,outline:"none",marginBottom:10}}
            autoFocus/>
          <div style={{marginBottom:10}}>
            <div style={{fontSize:11,color:"#5a6478",marginBottom:8,textTransform:"uppercase",letterSpacing:1,fontFamily:"'Barlow Condensed',sans-serif",fontWeight:600}}>Profile Type</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
              {Object.entries(PROFILE_TYPE_LABELS).map(([val,lbl])=>(
                <button key={val} onClick={()=>setNewType(val)}
                  style={{background:newType===val?"#00e5a0":"#111418",color:newType===val?"#000":"#5a6478",border:"1px solid "+(newType===val?"#00e5a0":"#1e2530"),borderRadius:8,padding:"9px 10px",fontFamily:"'Barlow Condensed',sans-serif",fontSize:13,fontWeight:600,cursor:"pointer",transition:"all .18s"}}>
                  {lbl}
                </button>
              ))}
            </div>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={createProfile} disabled={!newName.trim()}
              style={{flex:1,background:"#00e5a0",color:"#000",border:"none",borderRadius:10,padding:14,fontFamily:"'Barlow Condensed',sans-serif",fontSize:16,fontWeight:700,letterSpacing:1,cursor:"pointer"}}>
              Create
            </button>
            <button onClick={()=>{setShowNew(false);setNewName("");}}
              style={{background:"none",border:"1px solid #1e2530",color:"#5a6478",borderRadius:10,padding:"14px 18px",fontFamily:"'Barlow Condensed',sans-serif",fontSize:14,cursor:"pointer"}}>
              Cancel
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// ── MAIN APP ───────────────────────────────────────────────────
function VitalCore() {
  const today = new Date().toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});

  // Profile state
  const [profile, setProfile] = useState(()=>{
    const id = getActiveId();
    if(!id) return null;
    const profiles = getProfiles();
    return profiles.find(p=>p.id===id)||null;
  });

  const uid = profile?.id||"default";
  const TARGETS = PROFILE_TARGETS[profile?.type||"adult_male"];

  // All data keyed to current user
  const [logItems, setLogItems] = useState(()=>{ const s=uGet(uid,"log",{}); return s.date===today?(s.items||[]):[]});
  const [totals,   setTotals]   = useState(()=>{ const s=uGet(uid,"log",{}); return s.date===today&&s.totals?s.totals:EMPTY()});
  const [history,  setHistory]  = useState(()=> uGet(uid,"history",[]));
  const [library,  setLibrary]  = useState(()=> uGet(uid,"library",[]));
  const [recipes,  setRecipes]  = useState(()=> uGet(uid,"recipes",[]));

  // Reload data when profile switches
  useEffect(()=>{
    if(!profile) return;
    const s = uGet(uid,"log",{});
    setLogItems(s.date===today?(s.items||[]):[]);
    setTotals(s.date===today&&s.totals?s.totals:EMPTY());
    setHistory(uGet(uid,"history",[]));
    setLibrary(uGet(uid,"library",[]));
    setRecipes(uGet(uid,"recipes",[]));
    setCoachTips(null);
    setTab("camera");
  },[uid]);

  const [tab,       setTab]       = useState("camera");
  const [input,     setInput]     = useState("");
  const [servings,  setServings]  = useState(1);
  const [analyzing, setAnalyzing] = useState(false);
  const [preview,   setPreview]   = useState(null);
  const [labelPreviews, setLabelPreviews] = useState([]);
  const [needsLabel,setNeedsLabel]= useState(false);
  const [libSearch, setLibSearch] = useState("");
  const [histDetail,setHistDetail]= useState(null);
  const [toast,     setToast]     = useState({msg:"",show:false});
  const [coachTips, setCoachTips] = useState(null);
  const [coachLoading,setCoachLoading]=useState(false);
  const [expandedItem,setExpandedItem]=useState(null);
  const [editingItem, setEditingItem] =useState(null);
  const [recipeView,  setRecipeView]  =useState("list");
  const [activeRecipe,setActiveRecipe]=useState(null);
  const [recipeName,  setRecipeName]  =useState("");
  const [recipeIngredients,setRecipeIngredients]=useState("");
  const [recipeAnalyzing,setRecipeAnalyzing]=useState(false);
  const [recipeImgData,setRecipeImgData]=useState(null);
  const [recipePendingNutr,setRecipePendingNutr]=useState(null);
  const [showProfileSwitch,setShowProfileSwitch]=useState(false);

  const toastTimer=useRef(null); const textareaRef=useRef(null);
  const cameraRef=useRef(null);  const galleryRef=useRef(null);
  const labelRef=useRef(null);   const labelGalleryRef=useRef(null);
  const recipeImgRef=useRef(null);

  const calPct=Math.min(Math.round(((totals.calories||0)/TARGETS.calories)*100),999);
  const offset=289-(289*Math.min(calPct,100)/100);

  const showToast=useCallback((msg)=>{
    clearTimeout(toastTimer.current);
    setToast({msg,show:true});
    toastTimer.current=setTimeout(()=>setToast(t=>({...t,show:false})),2800);
  },[]);

  function recompute(items){
    const n=EMPTY();
    for(const item of items) for(const k of NUTR_KEYS) n[k]+=(item.baseNutr[k]||0)*item.servings;
    return n;
  }

  function persist(items,t){
    uSet(uid,"log",{date:today,items,totals:t});
    if(items.length>0){
      const snap={date:today,totals:{...t},itemCount:items.length};
      setHistory(prev=>{
        const next=[snap,...prev.filter(d=>d.date!==today)].slice(0,90);
        uSet(uid,"history",next);
        return next;
      });
    }
  }

  function compressImage(file,callback){
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      const canvas=document.createElement("canvas");
      const MAX=1200;let w=img.width,h=img.height;
      if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
      canvas.width=w;canvas.height=h;
      canvas.getContext("2d").drawImage(img,0,0,w,h);
      const dataUrl=canvas.toDataURL("image/jpeg",.85);
      callback({dataUrl,base64:dataUrl.split(",")[1],mime:"image/jpeg"});
    };
    img.src=url;
  }

  function handleFileSelect(e){const file=e.target.files[0];if(!file)return;e.target.value="";compressImage(file,p=>setPreview(p));}
  function handleLabelSelect(e){const file=e.target.files[0];if(!file)return;e.target.value="";compressImage(file,p=>setLabelPreviews(prev=>prev.length<4?[...prev,p]:prev));}

  async function analyzeImage(){
    if(!preview)return;
    setAnalyzing(true);
    const frontData={...preview};const labelData=[...labelPreviews];
    setPreview(null);setLabelPreviews([]);setNeedsLabel(false);setServings(1);
    const hasLabels=labelData.length>0;
    if(!hasLabels){
      try{
        const idRes=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({model:"claude-sonnet-4-5",max_tokens:100,messages:[{role:"user",content:[
            {type:"image",source:{type:"base64",media_type:frontData.mime,data:frontData.base64}},
            {type:"text",text:'Identify this product. Return ONLY JSON: {"name":"exact brand and product name"}'}
          ]}]})});
        const idData=await idRes.json();
        const idRaw=(idData.content||[]).map(b=>b.text||"").join("").replace(/```json|```/g,"").trim();
        const identified=JSON.parse(idRaw);
        const identifiedName=(identified.name||"").toLowerCase();
        const libMatch=library.find(l=>{
          const ln=l.name.toLowerCase();
          return identifiedName.includes(ln.split(" ")[0])||ln.includes(identifiedName.split(" ")[0]);
        });
        if(libMatch){addItem({...libMatch.baseNutr,name:libMatch.name,emoji:libMatch.emoji},null,servings);setAnalyzing(false);showToast("✓ "+libMatch.name+" from library!");return;}
      }catch(e){}
    }
    const prompt=hasLabels
      ?`You are a precision nutrition label reader. Image 1 is the product front (use for name). Images 2+ are label panels (read ALL for exact values). Combine nutrients from all label images. For Vitamin D convert mcg to IU (1mcg=40IU). Return ONLY JSON no markdown: {"name":"exact brand+product","emoji":"emoji","needs_label":false,"calories":n,"protein":n,"carbs":n,"fat":n,"fiber":n,"sodium":n,"calcium":n,"magnesium":n,"vitD":n,"vitC":n,"potassium":n,"zinc":n,"sugar":n} Per 1 serving. vitD in IU.`
      :`You are a precision nutrition label reader. Read exact values from any visible label. For Vitamin D convert mcg to IU (1mcg=40IU). Use exact brand+product name. Return ONLY JSON no markdown: {"name":"exact brand+product","emoji":"emoji","needs_label":false,"calories":n,"protein":n,"carbs":n,"fat":n,"fiber":n,"sodium":n,"calcium":n,"magnesium":n,"vitD":n,"vitC":n,"potassium":n,"zinc":n,"sugar":n} Per 1 serving. vitD in IU.`;
    const content=[
      {type:"image",source:{type:"base64",media_type:frontData.mime,data:frontData.base64}},
      ...labelData.map(lp=>({type:"image",source:{type:"base64",media_type:lp.mime,data:lp.base64}})),
      {type:"text",text:prompt}
    ];
    try{
      const res=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-5",max_tokens:600,messages:[{role:"user",content}]})});
      const data=await res.json();
      if(data.error){showToast("Error: "+String(data.error).slice(0,60));return;}
      const raw=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text||"").join("").replace(/```json|```/g,"").trim();
      if(!raw){showToast("No response — try typing instead");return;}
      const n=JSON.parse(raw);
      if(n.needs_label){setNeedsLabel(true);return;}
      addItem(n,null,servings);
    }catch(e){showToast("Error: "+String(e.message||e).slice(0,60));}
    finally{setAnalyzing(false);}
  }

  async function handleLog(){
    const text=input.trim();if(!text||analyzing)return;
    setAnalyzing(true);setInput("");const srv=servings;setServings(1);
    const prompt=`Nutrition AI. User consumed: "${text}" Return ONLY JSON no markdown: {"name":"clean name","emoji":"emoji","calories":n,"protein":n,"carbs":n,"fat":n,"fiber":n,"sodium":n,"calcium":n,"magnesium":n,"vitD":n,"vitC":n,"potassium":n,"zinc":n,"sugar":n} Per 1 serving. 0 for negligible.`;
    try{
      const res=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-5",max_tokens:500,messages:[{role:"user",content:prompt}]})});
      const data=await res.json();
      if(data.error){showToast("Error: "+String(data.error).slice(0,60));return;}
      const raw=(data.content||[]).map(b=>b.text||"").join("").replace(/```json|```/g,"").trim();
      const n=JSON.parse(raw);addItem(n,text,srv);
    }catch(e){showToast("Error: "+String(e.message||e).slice(0,60));}
    finally{setAnalyzing(false);}
  }

  function addItem(n,originalText,srv){
    const time=new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",hour12:true});
    const baseNutr={calories:+n.calories||0,protein:+n.protein||0,carbs:+n.carbs||0,fat:+n.fat||0,fiber:+n.fiber||0,sodium:+n.sodium||0,calcium:+n.calcium||0,magnesium:+n.magnesium||0,vitD:+n.vitD||0,vitC:+n.vitC||0,potassium:+n.potassium||0,zinc:+n.zinc||0,sugar:+n.sugar||0};
    const item={id:Date.now(),time,name:n.name||(originalText||"Item"),emoji:n.emoji||"🍽️",servings:srv,baseNutr};
    setLogItems(prev=>{const next=[item,...prev];const t=recompute(next);setTotals(t);persist(next,t);return next;});
    setLibrary(prev=>{
      if(prev.find(l=>l.name.toLowerCase()===item.name.toLowerCase()))return prev;
      const next=[{id:item.id,name:item.name,emoji:item.emoji,baseNutr},...prev].slice(0,100);
      uSet(uid,"library",next);return next;
    });
    showToast("✓ "+item.name+" × "+srv+" logged");
  }

  function logFromLib(libItem){
    const time=new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",hour12:true});
    const item={id:Date.now(),time,name:libItem.name,emoji:libItem.emoji,servings:1,baseNutr:libItem.baseNutr};
    setLogItems(prev=>{const next=[item,...prev];const t=recompute(next);setTotals(t);persist(next,t);return next;});
    showToast("✓ "+item.name+" logged");
  }

  function changeServings(id,delta){
    setLogItems(prev=>{const next=prev.map(i=>i.id!==id?i:{...i,servings:Math.max(0.5,Math.min(10,+(i.servings+delta).toFixed(1)))});const t=recompute(next);setTotals(t);persist(next,t);return next;});
  }
  function deleteItem(id){setLogItems(prev=>{const next=prev.filter(i=>i.id!==id);const t=recompute(next);setTotals(t);persist(next,t);return next;});showToast("Item removed");}
  function resetDay(){if(!window.confirm("Reset today's log?"))return;setLogItems([]);setTotals(EMPTY());uSet(uid,"log",{date:today,items:[],totals:EMPTY()});showToast("Day reset");}
  function delFromLib(id){setLibrary(prev=>{const next=prev.filter(i=>i.id!==id);uSet(uid,"library",next);return next;});}

  function startEdit(itemId,field,currentVal){setEditingItem({id:itemId,field,value:String(currentVal)});}
  function commitEdit(){
    if(!editingItem)return;
    const{id,field,value}=editingItem;const num=parseFloat(value);
    if(isNaN(num)||num<0){setEditingItem(null);return;}
    setLogItems(prev=>{const next=prev.map(i=>{if(i.id!==id)return i;return{...i,baseNutr:{...i.baseNutr,[field]:num}};});const t=recompute(next);setTotals(t);persist(next,t);return next;});
    setEditingItem(null);showToast("✓ Updated");
  }

  function saveRecipe(recipe){setRecipes(prev=>{const existing=prev.find(r=>r.id===recipe.id);const next=existing?prev.map(r=>r.id===recipe.id?recipe:r):[recipe,...prev];uSet(uid,"recipes",next);return next;});}
  function deleteRecipe(id){setRecipes(prev=>{const next=prev.filter(r=>r.id!==id);uSet(uid,"recipes",next);return next;});}
  function logRecipe(recipe,srv){addItem({name:recipe.name,emoji:recipe.emoji||"🍽️",...recipe.nutr},null,srv||1);}

  async function analyzeRecipe(name,ingredients,imageData){
    setRecipeAnalyzing(true);
    const hasImage=!!imageData;
    const prompt=`Nutrition AI for homemade recipes. ${hasImage?"You have a recipe/ingredient photo. ":""}${ingredients?"Ingredients: "+ingredients:""} Recipe: "${name}" Return nutrition per 1 serving. ONLY JSON no markdown: {"emoji":"emoji","servingsInRecipe":n,"calories":n,"protein":n,"carbs":n,"fat":n,"fiber":n,"sodium":n,"calcium":n,"magnesium":n,"vitD":n,"vitC":n,"potassium":n,"zinc":n,"sugar":n}`;
    const content=[];
    if(hasImage)content.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:imageData}});
    content.push({type:"text",text:prompt});
    try{
      const res=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-5",max_tokens:600,messages:[{role:"user",content}]})});
      const data=await res.json();
      if(data.error){showToast("Recipe error");return null;}
      const raw=(data.content||[]).map(b=>b.text||"").join("").replace(/```json|```/g,"").trim();
      return JSON.parse(raw);
    }catch(e){showToast("Recipe error — try again");return null;}
    finally{setRecipeAnalyzing(false);}
  }

  async function getCoachAdvice(){
    if(logItems.length===0){showToast("Log some food first!");return;}
    setCoachLoading(true);setCoachTips(null);
    const hour=new Date().getHours();
    const timeOfDay=hour<12?"morning":hour<17?"afternoon":"evening";
    const foodList=logItems.map(i=>i.name+" x"+i.servings).join(", ");
    const todaySummary=Object.entries(NUTR_META).map(([key,cfg])=>{
      const val=totals[key]||0,goal=TARGETS[key],pct=Math.round((val/goal)*100);
      return key+": "+Math.round(val)+cfg.unit+" ("+pct+"% of "+goal+cfg.unit+") canExceed:"+cfg.canExceed;
    }).join("\n");
    const last7=history.filter(d=>d.date!==today).slice(0,7);
    let histCtx="";
    if(last7.length>0){
      const avgSummary=Object.entries(NUTR_META).map(([key,cfg])=>{
        const vals=last7.map(d=>d.totals[key]||0);
        const avg=Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
        const pct=Math.round((avg/TARGETS[key])*100);
        const daysUnder=vals.filter(v=>(v/TARGETS[key])<0.7).length;
        const daysOver=vals.filter(v=>(v/TARGETS[key])>1.1).length;
        const pattern=daysUnder>=5?"consistently low ("+daysUnder+"/"+vals.length+" days)":daysOver>=4?"consistently over ("+daysOver+"/"+vals.length+" days)":daysUnder>=3?"frequently low":"on track";
        return cfg.label+": avg "+avg+cfg.unit+" ("+pct+"%) — "+pattern;
      }).join("\n");
      histCtx="\nLAST "+last7.length+" DAYS:\n"+last7.map(d=>d.date.split(",")[1]?.trim()+": "+Math.round(d.totals.calories||0)+"kcal, "+Math.round(d.totals.protein||0)+"g protein").join("\n")+"\n7-day averages:\n"+avgSummary;
    }
    const userName=profile?.name||"the user";
    const profileType=PROFILE_TYPE_LABELS[profile?.type||"adult_male"]||"";
    const prompt=`You are a friendly nutrition coach for VitalCore. User: ${userName} (${profileType}). It is ${timeOfDay}. Today logged: ${foodList}\n\nTODAY:\n${todaySummary}${histCtx}\n\nGive 4-6 plain-English coaching tips. Lead with most important. Reference patterns when history available. canExceed:true nutrients are fine to go over. Keep tips 2-3 sentences. No medical jargon. Use the person's name ${userName} occasionally.\n\nReturn ONLY JSON array no markdown:\n[{"type":"good|caution|warn|info","icon":"emoji","title":"short title","body":"tip"}]`;
    try{
      const res=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-5",max_tokens:1200,messages:[{role:"user",content:prompt}]})});
      const data=await res.json();
      if(data.error){showToast("Coach error");return;}
      const raw=(data.content||[]).map(b=>b.text||"").join("").replace(/```json|```/g,"").trim();
      setCoachTips(JSON.parse(raw));
    }catch(e){showToast("Coach error — try again");}
    finally{setCoachLoading(false);}
  }

  function statusFor(key,val){
    const goal=TARGETS[key],unit=NUTR_META[key].unit,pct=(val/goal)*100;
    if(val===0)  return{text:"Need "+goal+unit,color:"#5a6478"};
    if(pct>110)  return{text:"Over by "+Math.round(val-goal)+unit,color:"#ef4444"};
    if(pct>=100) return{text:"✓ Goal met",color:"#00e5a0"};
    if(pct<30)   return{text:Math.round(goal-val)+unit+" remaining",color:"#f59e0b"};
    return{text:Math.round(goal-val)+unit+" remaining",color:"#00e5a0"};
  }

  const scaled=(item,key)=>fmt(item.baseNutr[key]*item.servings);

  function dayClass(snap){
    if(!snap)return"nodata";const pct=(snap.totals.calories||0)/TARGETS.calories*100;
    if(pct>=90&&pct<=115)return"great";if(pct>=70&&pct<90)return"good";if(pct>115)return"over";return"low";

size:10px;color:#5a6478}.vdval{font-size:12px;font-weight:600;color:#e8edf2;cursor:pointer;border-bottom:1px dashed #3a4456;min-width:40px;text-align:right}.vdval:hover{color:#00e5a0;border-color:#00e5a0}.vdedit{display:flex;align-items:center;gap:4px}.vdinput{background:#0a0c0f;border:1px solid #00e5a0;border-radius:4px;color:#e8edf2;font-size:12px;font-weight:600;width:60px;padding:2px 6px;text-align:right;outline:none}.vdsave{background:#00e5a0;color:#000;border:none;border-radius:4px;padding:2px 8px;font-size:11px;font-weight:700;cursor:pointer}.vnote{font-size:10px;color:#5a6478;font-style:italic;margin-top:4px}.vanalyzing{position:fixed;inset:0;background:rgba(10,12,15,.93);z-index:400;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}.vpulse{width:80px;height:80px;border-radius:50%;border:3px solid #00e5a0;animation:vcp 1.2s ease-in-out infinite}.vat{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:#00e5a0}.vas{font-size:13px;color:#5a6478}.vtoast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#161b22;border:1px solid #00e5a0;border-radius:10px;padding:12px 20px;font-size:13px;font-weight:500;color:#00e5a0;transition:transform .3s ease;z-index:500;white-space:nowrap;pointer-events:none}.vtoast.show{transform:translateX(-50%) translateY(0)}@keyframes vcp{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.18);opacity:.4;}}@keyframes vci{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}`;

  return(
    <React.Fragment>
      <style>{S}</style>
      <div className="vc">

        <header className="vch">
          <div className="vlogo">Vital<span>Core</span></div>
          <div className="vhdr-right">
            <div className="vdate">{today}</div>
            <div className="vavatar" style={{background:getColor(profileIdx)}} onClick={()=>setShowProfileSwitch(true)} title="Switch profile">
              {profile.name[0].toUpperCase()}
            </div>
          </div>
        </header>

        <div className="vsum">
          <div className="vscard">
            <div className="vring">
              <svg width="110" height="110" viewBox="0 0 110 110">
                <circle cx="55" cy="55" r="46" fill="none" stroke="#1e2530" strokeWidth="8"/>
                <circle cx="55" cy="55" r="46" fill="none" stroke="#00e5a0" strokeWidth="8" strokeLinecap="round" strokeDasharray="289" strokeDashoffset={offset} style={{transition:"stroke-dashoffset 1s ease"}}/>
              </svg>
              <div className="vringc"><div className="vringp">{calPct}%</div><div className="vringl">calories</div></div>
            </div>
            <div>
              <div className="vstitle">{profile.name}'s Intake</div>
              <div className="vchips">
                {[{k:"protein",l:"Protein",c:"#00e5a0",u:"g"},{k:"carbs",l:"Carbs",c:"#4fc3f7",u:"g"},{k:"fat",l:"Fat",c:"#ff6b35",u:"g"},{k:"calories",l:"kcal",c:"#f59e0b",u:""}].map(m=>(
                  <div className="vchip" key={m.k}>
                    <span className="vchipv" style={{color:m.c}}>{Math.round(totals[m.k]||0)}{m.u}</span>
                    <span className="vchipl">{m.l}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>

        <div className="vtabs">
          <button className={"vtab"+(tab==="camera"?" active":"")} onClick={()=>setTab("camera")}>📷 Camera</button>
          <button className={"vtab"+(tab==="text"?" active":"")} onClick={()=>setTab("text")}>✏️ Type</button>
          <button className={"vtab"+(tab==="library"?" active":"")} onClick={()=>setTab("library")}>📚 Library</button>
          <button className={"vtab"+(tab==="recipes"?" active":"")} onClick={()=>setTab("recipes")}>👨‍🍳 Recipes</button>
          <button className={"vtab"+(tab==="history"?" active":"")} onClick={()=>setTab("history")}>📈 History</button>
          <button className={"vtab"+(tab==="coach"?" active":"")} onClick={()=>{setCoachTips(null);setTab("coach");}}>🤖 Coach</button>
        </div>

        {/* CAMERA TAB */}
        {tab==="camera"&&(
          <div className="vcam">
            <div className="vcamc">
              <span className="vcaml">Snap or Upload Photos</span>
              {needsLabel&&!preview&&(
                <div className="vlp"><div className="vlpi">🏷️</div><div className="vlpt">Label Needed</div><div className="vlps">Snap the nutrition facts label on the back.</div>
                  <button className="vlpb" onClick={()=>{setNeedsLabel(false);cameraRef.current.click();}}>📷 Snap Label</button>
                </div>
              )}
              {!needsLabel&&(
                <React.Fragment>
                  <div style={{marginBottom:10}}>
                    <div style={{fontSize:10,color:"#5a6478",textTransform:"uppercase",letterSpacing:1,marginBottom:6,fontFamily:"'Barlow Condensed',sans-serif",fontWeight:600}}>Step 1 — Product Front</div>
                    <div className={"vpslot"+(preview?" filled":"")} style={{aspectRatio:"16/9"}} onClick={()=>!preview&&cameraRef.current.click()}>
                      {preview?(
                        <React.Fragment>
                          <img src={preview.dataUrl} alt="front" style={{width:"100%",height:"100%",objectFit:"cover"}}/>
                          <div className="vpsb">Front ✓</div>
                          <button className="vpsr" onClick={e=>{e.stopPropagation();setPreview(null);}}>✕</button>
                        </React.Fragment>
                      ):(
                        <div className="vpse" style={{flexDirection:"row",gap:10}}>
                          <div style={{fontSize:26}}>📦</div>
                          <div style={{fontSize:12,color:"#5a6478"}}>Tap to snap or choose<br/><span style={{color:"#3a4456"}}>Front of product</span></div>
                        </div>
                      )}
                    </div>
                  </div>
                  {preview&&(
                    <div style={{marginBottom:14}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                        <div style={{fontSize:10,color:"#5a6478",textTransform:"uppercase",letterSpacing:1,fontFamily:"'Barlow Condensed',sans-serif",fontWeight:600}}>Step 2 — Nutrition Label(s)</div>
                        <div style={{fontSize:10,color:"#3a4456"}}>Multiple if label wraps around</div>
                      </div>
                      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6}}>
                        {labelPreviews.map((lp,i)=>(
                          <div key={i} className="vpslot filled" style={{aspectRatio:"1"}}>
                            <img src={lp.dataUrl} alt={"label "+(i+1)} style={{width:"100%",height:"100%",objectFit:"cover"}}/>
                            <div className="vpsb" style={{fontSize:8,padding:"1px 4px"}}>{i+1}</div>
                            <button className="vpsr" onClick={e=>{e.stopPropagation();setLabelPreviews(prev=>prev.filter((_,j)=>j!==i));}}>✕</button>
                          </div>
                        ))}
                        {labelPreviews.length<4&&(
                          <div className="vpslot" style={{aspectRatio:"1"}} onClick={()=>labelRef.current.click()}>
                            <div className="vpse"><div style={{fontSize:20}}>🏷️</div><div style={{fontSize:9,color:"#5a6478",textAlign:"center"}}>{labelPreviews.length===0?"Add label":"Add more"}</div></div>
                          </div>
                        )}
                      </div>
                      {labelPreviews.length>0&&<div style={{marginTop:8,fontSize:11,color:"#5a6478"}}>{labelPreviews.length} label photo{labelPreviews.length>1?"s":""} — AI reads all panels</div>}
                    </div>
                  )}
                  {!preview&&(
                    <button className="vcamb" onClick={()=>galleryRef.current.click()}>
                      <div className="vcambi">🖼️</div>
                      <div className="vcambt"><span className="vcambttl">Choose from Gallery</span><span className="vcambsub">Pick existing photo</span></div>
                    </button>
                  )}
                  {preview&&(
                    <React.Fragment>
                      <div className="vsrv" style={{marginBottom:14}}>
                        <span className="vsrvl">Servings</span>
                        <div className="vsrvc">
                          <button className="vsrvb" onClick={()=>setServings(s=>Math.max(0.5,+(s-.5).toFixed(1)))} disabled={servings<=0.5}>−</button>
                          <div className="vsrvv">{servings}</div>
                          <button className="vsrvb" onClick={()=>setServings(s=>Math.min(10,+(s+.5).toFixed(1)))} disabled={servings>=10}>+</button>
                        </div>
                      </div>
                      <button className="vana" onClick={analyzeImage} disabled={analyzing}>
                        {labelPreviews.length>1?"Analyze "+labelPreviews.length+" Labels & Log":labelPreviews.length===1?"Analyze Both & Log":"Analyze & Log"}
                      </button>
                    </React.Fragment>
                  )}
                </React.Fragment>
              )}
              <input ref={cameraRef} type="file" accept="image/*" capture="environment" onChange={handleFileSelect} style={{display:"none"}}/>
              <input ref={galleryRef} type="file" accept="image/*" onChange={handleFileSelect} style={{display:"none"}}/>
              <input ref={labelRef} type="file" accept="image/*" capture="environment" onChange={handleLabelSelect} style={{display:"none"}}/>
              <input ref={labelGalleryRef} type="file" accept="image/*" onChange={handleLabelSelect} style={{display:"none"}}/>
            </div>
          </div>
        )}

        {/* TEXT TAB */}
        {tab==="text"&&(
          <div className="vinput">
            <div className="vinputc">
              <span className="vinputl">Describe What You Ate</span>
              <div className="vinputr">
                <textarea ref={textareaRef} className="vta" placeholder='"Premier Protein shake" or "6oz chicken breast"'
                  value={input} onChange={e=>setInput(e.target.value)}
                  onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();handleLog();}}} rows={2}/>
                <button className="vlogb" onClick={handleLog} disabled={!input.trim()||analyzing}>Log It</button>
              </div>
              <div className="vsrv">
                <span className="vsrvl">Servings</span>
                <div className="vsrvc">
                  <button className="vsrvb" onClick={()=>setServings(s=>Math.max(0.5,+(s-.5).toFixed(1)))} disabled={servings<=0.5}>−</button>
                  <div className="vsrvv">{servings}</div>
                  <button className="vsrvb" onClick={()=>setServings(s=>Math.min(10,+(s+.5).toFixed(1)))} disabled={servings>=10}>+</button>
                </div>
              </div>
              <div className="vex">{EXAMPLES.map(ex=><button key={ex} className="vexb" onClick={()=>{setInput(ex);textareaRef.current&&textareaRef.current.focus();}}>{ex}</button>)}</div>
            </div>
          </div>
        )}

        {/* LIBRARY TAB */}
        {tab==="library"&&(
          <div className="vlib">
            <input className="vlibsr" placeholder="Search your food library…" value={libSearch} onChange={e=>setLibSearch(e.target.value)}/>
            {library.length===0?(
              <div style={{textAlign:"center",padding:"40px 20px",color:"#5a6478"}}><div style={{fontSize:36,marginBottom:12}}>📚</div><p style={{fontSize:14,lineHeight:1.6}}>Foods you log are saved here<br/>for quick re-logging.</p></div>
            ):library.filter(i=>i.name.toLowerCase().includes(libSearch.toLowerCase())).map(item=>(
              <div className="vlibitem" key={item.id}>
                <div className="vlibicon">{item.emoji}</div>
                <div className="vlibdet"><div className="vlibname">{item.name}</div><div className="vlibmac">{item.baseNutr.calories} kcal · {item.baseNutr.protein}g protein</div></div>
                <button className="vlibadd" onClick={()=>logFromLib(item)}>+ Log</button>
                <button className="vlibdel" onClick={()=>delFromLib(item.id)}>✕</button>
              </div>
            ))}
          </div>
        )}

        {tab==="recipes"&&<RecipeTab/>}
        {tab==="history"&&<HistoryTab/>}
        {tab==="coach"&&<CoachTab/>}

        {/* NUTRIENT BARS */}
        <div className="vnut">
          <div className="vnuts">Daily Progress</div>
          <div className="vnutl">
            {Object.entries(NUTR_META).map(([key,cfg])=>{
              const val=totals[key]||0,pct=Math.min((val/TARGETS[key])*100,100),over=(val/TARGETS[key])>1.1,st=statusFor(key,val);
              return(
                <div className="vnutitem" key={key}>
                  <div className="vnuthr"><span className="vnutn">{cfg.label}</span><span className="vnutv"><strong>{Math.round(val)}{cfg.unit}</strong> / {TARGETS[key]}{cfg.unit}</span></div>
                  <div className="vbar"><div className="vbarf" style={{width:pct+"%",background:over?"#ef4444":cfg.color}}/></div>
                  <div className="vnutst" style={{color:st.color}}>{st.text}</div>
                </div>
              );
            })}
          </div>
        </div>

        {/* LOG */}
        <div className="vlog">
          <div className="vlogh">
            <div className="vnuts" style={{marginBottom:0}}>Logged Items</div>
            {logItems.length>0&&<button className="vrst" onClick={resetDay}>Reset Day</button>}
          </div>
          <div className="vllist">
            {logItems.length===0?(
              <div className="vempty"><div className="vemptyi">🥗</div><p style={{fontSize:14,lineHeight:1.6}}>Snap a photo or type what you ate<br/>to start tracking.</p></div>
            ):logItems.map(item=>(
              <div className="vlitem" key={item.id}>
                <div className="vlicon">{item.emoji}</div>
                <div className="vldet">
                  <div className="vlname">{item.name}</div>
                  <div className="vltime">{item.time}</div>
                  <div className="vltags">
                    {item.baseNutr.protein>0&&<span className="vtag vtp">{scaled(item,"protein")}g protein</span>}
                    {item.baseNutr.carbs>0&&<span className="vtag vtc">{scaled(item,"carbs")}g carbs</span>}
                    {item.baseNutr.fat>0&&<span className="vtag vtf">{scaled(item,"fat")}g fat</span>}
                    {item.baseNutr.calories>0&&<span className="vtag vtk">{scaled(item,"calories")} kcal</span>}
                  </div>
                  <div className="visrv">
                    <span className="visrvl">Servings</span>
                    <button className="visb" onClick={()=>changeServings(item.id,-.5)} disabled={item.servings<=0.5}>−</button>
                    <span className="visv">{item.servings}</span>
                    <button className="visb" onClick={()=>changeServings(item.id,.5)} disabled={item.servings>=10}>+</button>
                  </div>
                  <button className="vexpand" onClick={()=>setExpandedItem(expandedItem===item.id?null:item.id)}>
                    {expandedItem===item.id?"▲ Hide details":"▼ Verify & edit nutrients"}
                  </button>
                  {expandedItem===item.id&&(
                    <div className="vdetails">
                      <div className="vdgrid">
                        {Object.entries(NUTR_META).map(([key,cfg])=>{
                          const val=item.baseNutr[key]||0;
                          const isEditing=editingItem&&editingItem.id===item.id&&editingItem.field===key;
                          return(
                            <div className="vdrow" key={key}>
                              <span className="vdlbl">{cfg.label}</span>
                              {isEditing?(
                                <div className="vdedit">
                                  <input className="vdinput" type="number" value={editingItem.value}
                                    onChange={e=>setEditingItem(ei=>({...ei,value:e.target.value}))}
                                    onKeyDown={e=>{if(e.key==="Enter")commitEdit();if(e.key==="Escape")setEditingItem(null);}}
                                    autoFocus/>
                                  <button className="vdsave" onClick={commitEdit}>✓</button>
                                </div>
                              ):(
                                <span className="vdval" onClick={()=>startEdit(item.id,key,val)}>{fmt(val)}{cfg.unit}</span>
                              )}
                            </div>
                          );
                        })}
                      </div>
                      <div className="vnote">Tap any value to correct it.</div>
                    </div>
                  )}
                </div>
                <div className="vlright"><button className="vldel" onClick={()=>deleteItem(item.id)}>✕</button></div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {analyzing&&(
        <div className="vanalyzing"><div className="vpulse"/><div className="vat">Analyzing</div><div className="vas">Looking up nutrition data…</div></div>
      )}
      <div className={"vtoast"+(toast.show?" show":"")}>{toast.msg}</div>
    </React.Fragment>
  );
}

function App(){
  const [profile,setProfile]=useState(()=>{
    const id=getActiveId();if(!id)return null;
    return getProfiles().find(p=>p.id===id)||null;
  });
  if(!profile) return <ProfileScreen onSelect={p=>{setActiveId(p.id);setProfile(p);}}/>;
  return <VitalCore key={profile.id}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
